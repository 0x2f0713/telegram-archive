[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "telegram-archiver"
version = "1.0.0"
description = "A resumable personal Telegram message and media archiver built with Telethon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "Telethon>=1.36,<2",
  "cryptg>=0.4,<1",
  "python-socks[asyncio]>=2.5,<3",
  "SQLAlchemy>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "rich>=13.9,<15",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "uvicorn>=0.32,<1",
  "textual>=1.0,<7",
  "qrcode>=8.0,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.8,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
telegram-archiver = "app.main:app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
